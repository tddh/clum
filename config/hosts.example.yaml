hosts:
  # 直连模式：需要 bridge_addr + bridge_token
  - name: prod-web-01
    bridge_addr: 10.0.1.10:9778
    bridge_token: "token-web-01-xxxxxxxx"
    group: production
    tags:
      - web
      - nginx
    labels:
      dc: shanghai
      rack: a3

  # 纯注册模式（enrolled）：bridge 反向注册到 central server 后无需 bridge_addr/bridge_token
  - name: prod-web-02
    group: production
    tags:
      - web
    labels:
      dc: shanghai

  - name: prod-db-01
    bridge_addr: 10.0.1.20:9778
    bridge_token: "token-db-01-xxxxxxxx"
    group: production
    tags:
      - database
      - postgres
    labels:
      dc: shanghai
      rack: b1
    # 可选：限制隧道目标（不配置 = 全部允许）
    # allowed_forward_targets:
    #   - "127.0.0.1:5432"
    #   - "10.0.1.*:*"

  - name: dev-gpu-01
    bridge_addr: 10.0.2.10:9778
    bridge_token: "token-gpu-01-xxxxxxxx"
    group: development
    tags:
      - gpu
      - training
    labels:
      dc: beijing
