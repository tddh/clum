# clum 命令规则（人工维护，支持 reload_config 热重载）
#
# 动作：deny（直接拦截）/ allow（放行）。
# - permissive（默认）：未命中任何规则即执行；`ask` 视为放行。
# - strict：`ask` 直接拒绝；未命中且 KB 未收录同样拒绝。
# 规则按 priority 升序评估，首个命中生效。审批运行时已移除，不存在人工批准。
# 权限层（authorize 的 capability + selector）先于本文件生效——本文件是权限之后的第二道闸。
# 命令规则是防误操作护栏，不是安全边界。

schema_version = 1

# ⚠️ 本文件**不支持** `default_effect`：未知命令的默认动作是编译期常量 `ask`，
# 写在这里会被静默忽略（旧版文档误导，已更正；见 INVARIANTS §14.1）。
# 要放宽某条命令，请改 config/command-kb.toml 给它加 [[command]] 条目，而不是改默认值。

# ───────── 示例：禁止一切删除类操作（按需启用）─────────
# [[rule]]
# id = "block-destructive"
# priority = 10
# tool = ["exec", "batch_exec", "shell_command"]
# program = ["rm", "mkfs.ext4", "mkfs.xfs", "dd", "fdisk", "parted", "shred"]
# action = "deny"
# reason = "破坏性命令默认禁止"

# ───────── 示例：生产环境变更需人工批准 ─────────
# [[rule]]
# id = "prod-write-approval"
# priority = 50
# host_group = ["prod"]
# argv_regex = "^(systemctl (restart|stop|disable)|docker (rm|stop|kill)|kubectl (delete|drain))"
# action = "deny"
# reason = "生产环境变更默认拒绝（审批通道已移除）"

# ───────── 示例：堵住无命令载荷的旁路通道（默认关闭）─────────
# paste_buffer 的内容在远端缓冲区，拿不到命令文本，默认**不裁决**
# （否则每次粘贴都要人工批准，闸门会被运维关掉）。按 `tool` 限定的规则对它们
# **确实生效**：启用下面这条即可强制 ask。此类调用的审批指纹是
# sha256(tool_name + 规范化 args)，参数变一个字符就要重新批准。
#
# 注意：respawn_pane / split_pane_with 的 `command` 与 cmd_escape 的 rmux 参数
# 现在都已纳入载荷裁决，不再属于「无命令载荷」通道。
# 不带 command 的 respawn_pane 也会 fail-closed 到 ask（它会重跑既有进程规格，
# 可能重放一次已批准的命令）；如需放行，用 tool 维度规则显式 allow。
# [[rule]]
# id = "allow-bare-respawn"
# priority = 80
# tool = ["respawn_pane"]
# # 仅放行「裸 respawn」哨兵；带 command 的调用不匹配，仍按载荷裁决。
# # 没有这一行时，tool 维度 allow 会连 respawn_pane(command="…") 一起放行。
# argv_regex = "^respawn-pane:existing-process$"
# action = "allow"
# reason = "重启 pane 的 shell 属于日常操作"
# [[rule]]
# id = "paste-buffer-approval"
# priority = 20
# tool = ["paste_buffer"]
# action = "ask"
# reason = "该通道内容无法静态检查，需人工确认"

# ───────── 破坏性命令硬拦截（permissive 策略）─────────
# 默认放行由 config/command-kb.toml 的 `default_effect = "allow"` 控制。
# 这里只列「不可逆且没有日常正当用途」的命令。
#
# 定位：防误操作 / 防模型幻觉，**不是安全边界**。变量拼接、脚本文件、
# base64、`bash -c "$X"` 等仍可绕过；真正的边界是 agent key 的权限范围
# 和「agent 不以 root 运行」。审批通道已移除，命中 deny 直接拒绝。

# 只读的磁盘查看命令先放行（priority 更小，先评估）。
[[rule]]
id = "allow-disk-inspect"
priority = 5
tool = ["exec", "batch_exec", "shell_command"]
program = ["fdisk", "parted", "sfdisk", "blkid", "lsblk"]
argv_regex = '^(\S+)\s+(-l|--list)\b'
action = "allow"
reason = "只读磁盘查看"

# 递归删除系统关键路径。
[[rule]]
id = "deny-rm-critical-path"
priority = 10
tool = ["exec", "batch_exec", "shell_command", "send_keys", "send_text", "batch_send_keys", "broadcast_keys", "paste_buffer"]
program = ["rm"]
argv_regex = '^rm\s+(-[a-zA-Z]+\s+)*(/|/\*|/etc|/usr|/var|/boot|/root|/home|~|\$HOME)(/|\s|$)'
action = "deny"
reason = "禁止删除系统关键路径"

# 写块设备 / 格式化 / 分区表操作。
[[rule]]
id = "deny-block-device"
priority = 10
tool = ["exec", "batch_exec", "shell_command", "send_keys", "send_text", "batch_send_keys", "broadcast_keys", "paste_buffer"]
program = ["dd"]
argv_regex = 'of=/dev/'
action = "deny"
reason = "禁止写裸块设备"

[[rule]]
id = "deny-format-and-partition"
priority = 10
tool = ["exec", "batch_exec", "shell_command", "send_keys", "send_text", "batch_send_keys", "broadcast_keys", "paste_buffer"]
program = ["mkfs", "mkfs.ext4", "mkfs.xfs", "mkfs.btrfs", "mkfs.f2fs", "mkfs.vfat", "mkfs.ntfs", "wipefs", "fdisk", "sfdisk", "parted"]
action = "deny"
reason = "禁止格式化或改写分区表"

# 关机 / 断网 / 杀 init。
[[rule]]
id = "deny-power"
priority = 10
tool = ["exec", "batch_exec", "shell_command", "send_keys", "send_text", "batch_send_keys", "broadcast_keys", "paste_buffer"]
program = ["shutdown", "reboot", "halt", "poweroff"]
action = "deny"
reason = "禁止关机/重启"

[[rule]]
id = "deny-flush-firewall"
priority = 10
tool = ["exec", "batch_exec", "shell_command", "send_keys", "send_text", "batch_send_keys", "broadcast_keys", "paste_buffer"]
program = ["iptables", "nft"]
argv_regex = '(iptables.*\s-F|nft\s+flush)'
action = "deny"
reason = "禁止清空防火墙规则（可能导致失联）"

[[rule]]
id = "deny-kill-init"
priority = 10
tool = ["exec", "batch_exec", "shell_command", "send_keys", "send_text", "batch_send_keys", "broadcast_keys", "paste_buffer"]
program = ["kill"]
argv_regex = '^kill\s+(-[a-zA-Z]+\s+)*1\s*$'
action = "deny"
reason = "禁止向 PID 1 发送信号"

# 解释器包装层：字符串匹配，只能挡住常见写法。
[[rule]]
id = "deny-interpreter-payload"
priority = 20
tool = ["exec", "batch_exec", "shell_command", "send_keys", "send_text", "batch_send_keys", "broadcast_keys", "paste_buffer"]
program = ["bash", "sh", "zsh", "dash", "ksh", "eval", "python", "python3", "perl", "ruby", "node"]
argv_regex = '(rm\s+-[rf]+|dd\s+of=/dev/|mkfs|wipefs|fdisk|parted|shutdown|reboot|iptables\s+-F|nft\s+flush|>+\s*/(etc|boot|usr|var))'
action = "deny"
reason = "解释器载荷包含破坏性命令（字符串匹配，非完备）"

[[rule]]
id = "deny-shell-via-xargs-find"
priority = 20
tool = ["exec", "batch_exec", "shell_command", "send_keys", "send_text", "batch_send_keys", "broadcast_keys", "paste_buffer"]
program = ["xargs", "find"]
argv_regex = '((sh|bash|zsh|dash)\s+-c|(-exec|-execdir)\s+(rm|sh|bash))'
action = "deny"
reason = "禁止通过 xargs/find 间接触发 shell"
