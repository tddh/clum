schema_version = 1

[[command]]
name = "systemctl"
effect = "ask"
arity = 2
source = "manual(clum)"
  [[command.subcommand]]
  name = ["status", "is-active", "is-enabled", "is-failed", "list-units", "list-unit-files", "show", "cat"]
  effect = "allow"
  read_only = true
  [[command.subcommand]]
  name = ["restart", "reload", "start", "stop", "enable", "disable", "mask"]
  effect = "ask"
  [[command.subcommand]]
  name = ["poweroff", "reboot", "halt", "daemon-reexec"]
  effect = "deny"

[[command]]
name = "journalctl"
effect = "allow"
read_only = true
dangerous_flags = ["--vacuum-size", "--vacuum-time", "--vacuum-files", "--rotate", "--flush", "--sync"]
escalate_to = "ask"
source = "manual(clum)"

[[command]]
name = "docker"
effect = "ask"
arity = 2
source = "manual(clum)"
  [[command.subcommand]]
  name = ["ps", "images", "logs", "inspect", "stats", "version", "info"]
  effect = "allow"
  read_only = true
  [[command.subcommand]]
  name = ["rm", "rmi", "stop", "kill", "restart", "run", "exec", "compose"]
  effect = "ask"
  [[command.subcommand]]
  name = ["system"]
  effect = "deny"
