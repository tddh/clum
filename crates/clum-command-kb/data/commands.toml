read_only = true
source = "manual(clum): read-only whitelist"

[[command]]
name = "rg"
effect = "allow"
read_only = true
dangerous_flags = ["--pre"]
escalate_to = "ask"
source = "manual(clum): read-only whitelist; --pre executes an arbitrary command"

