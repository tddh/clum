# ─────────── 运维 CLI（仅只读/文件传输子命令）───────────
# 自举缺口：这些 CLI 未收录时，agent 连 `clum-mcp approval list` / `clum-cli push`
# 都会被判 unknown → ask，无法闭环。
# 但**不能整体 allow**：
#   · `clum-mcp approval approve/deny` 会把「agent 不得自我批准」击穿；
#   · `clum-cli term/forward` 会打开交互终端/隧道，绕开命令闸门。
# 因此只放行只读与文件传输子命令，其余保持 ask（人类在本地终端执行）。
[[command]]
name = "clum-mcp"
effect = "ask"
source = "manual(clum): 仅只读子命令放行；approve/deny 必须由人类执行"
  [[command.subcommand]]
  name = ["approval", "list"]
  mode = "sequence"
  effect = "allow"
  [[command.subcommand]]
  name = ["audit", "verify"]
  mode = "sequence"
  effect = "allow"
  [[command.subcommand]]
  name = ["audit", "stats"]
  mode = "sequence"
  effect = "allow"
  [[command.subcommand]]
  name = ["--help"]
  effect = "allow"

[[command]]
name = "clum-cli"
effect = "ask"
source = "manual(clum): 仅只读/文件传输子命令放行；term/forward 不在放行之列"
  [[command.subcommand]]
  name = ["push", "pull", "list", "replay"]
  effect = "allow"
  [[command.subcommand]]
  name = ["--help"]
  effect = "allow"

