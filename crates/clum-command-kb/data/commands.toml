schema_version = 1
default_effect = "ask"

# ─────────── 只读白名单（Gemini CLI isKnownSafeCommand / prodagent read-only）───────────
# source: gemini-cli(apache-2.0) / prodagent(apache-2.0 OR mit)

[[command]]
name = "cat"
effect = "allow"
source = "gemini-cli(apache-2.0)"

# 其余只读命令由生成脚本追加（见 Step 2b），避免手写约 40 个同构块。

# ─────────── git 子命令粒度（prodagent read-only 标注）───────────

[[command]]
name = "git"
effect = "ask"
arity = 2
source = "prodagent(apache-2.0)"
  [[command.subcommand]]
  name = ["status", "log", "diff", "show", "branch", "remote"]
  effect = "allow"
  [[command.subcommand]]
  name = ["push", "reset", "clean", "rebase", "checkout"]
  effect = "ask"
  dangerous_flags = ["--force", "-f", "--hard"]

# ─────────── 文件系统变更（prodagent mutating + Gemini isDangerousCommand）───────────

[[command]]
name = "rm"
effect = "ask"
dangerous_flags = ["-f", "--force", "-rf", "-fr", "-r"]
escalate_to = "deny"
source = "gemini-cli(apache-2.0)+prodagent(apache-2.0)"

# 其余文件系统变更命令由生成脚本追加（见 Step 2b）。

# ─────────── kubectl（prodagent effect 标注 + K8s verb 模型校准）───────────

[[command]]
name = "kubectl"
effect = "ask"
arity = 2
source = "prodagent(apache-2.0)"
  [[command.subcommand]]
  name = ["get", "describe", "logs", "explain", "version", "api-resources", "config"]
  effect = "allow"
  [[command.subcommand]]
  name = ["apply", "create", "edit", "patch", "scale", "rollout", "exec", "cp", "port-forward"]
  effect = "ask"
  [[command.subcommand]]
  name = ["delete", "drain", "cordon", "taint", "replace"]
  effect = "ask"
  dangerous_flags = ["--all", "--force", "--grace-period=0", "--prune"]

# ─────────── systemd / 日志（overlay 手工标注，见 overlay.toml）───────────

# ─────────── 收紧 generated.toml 的过宽判定 ───────────
# safe-chains 的 level 是**命令级**，丢失 flag 粒度：下面这些命令被标 SafeRead，
# 但在特定 flag 下会写盘，必须靠 dangerous_flags 升格为 ask（见 kb.rs 的匹配逻辑，
# 短选项簇也命中：声明 `-x` 能拦住 `-xzf`）。

[[command]]
name = "sed"
effect = "allow"
dangerous_flags = ["-i", "--in-place", "-s", "--separate"]
escalate_to = "ask"
source = "manual(clum): safe-chains 标 SafeRead，但 -i/--in-place 原地改写文件"

[[command]]
name = "tar"
effect = "allow"
dangerous_flags = [
    "-c", "--create", "-x", "--extract", "-r", "--append",
    "-u", "--update", "-A", "--catenate", "--delete",
]
escalate_to = "ask"
source = "manual(clum): safe-chains 标 SafeRead，但 -c/-x/-r/-u/--delete 会写盘"

[[command]]
name = "awk"
effect = "ask"
dangerous_flags = ["-i", "--inplace"]
source = "manual(clum): awk 的 BEGIN{system(...)} 可执行任意命令；-i 会原地改写文件"

[[command]]
name = "sort"
effect = "allow"
dangerous_flags = ["-o", "--output"]
escalate_to = "ask"
source = "manual(clum): sort -o/--output 会写文件"

