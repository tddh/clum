[[command]]
name = "date"
effect = "allow"
read_only = true
dangerous_flags = ["-s", "--set"]
escalate_to = "ask"
source = "manual(clum): read-only whitelist; -s/--set writes the clock"

[[command]]
name = "kubectl"
effect = "ask"
arity = 2
source = "manual(clum): read-only subcommands; mutations stay ask"
  [[command.subcommand]]
  name = ["get", "describe", "logs", "explain", "version", "api-resources"]
  effect = "allow"
  read_only = true
  [[command.subcommand]]
  name = ["apply", "create", "edit", "patch", "scale", "rollout", "exec", "cp", "port-forward", "delete", "drain", "cordon", "taint", "replace"]
  effect = "ask"

[[command]]
name = "git"
effect = "ask"
arity = 2
source = "manual(clum): read-only subcommands; branch/remote can mutate"
  [[command.subcommand]]
  name = ["status", "log", "diff", "show"]
  effect = "allow"
  read_only = true
  dangerous_flags = ["--output"]
  [[command.subcommand]]
  name = ["push", "reset", "clean", "rebase", "checkout", "branch", "remote"]
  effect = "ask"
  dangerous_flags = ["--force", "-f", "--hard"]

