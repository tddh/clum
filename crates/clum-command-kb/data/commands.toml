# ─────────── 只读执行白名单（command:read）───────────
# 默认 false 是 fail-closed；这里只标记确定不会写盘、不会执行子进程的命令。
# 未列出的命令（find/xargs/tee/sed/awk/sort/sudo/解释器…）永远不是只读。

[[command]]
name = "ls"
effect = "allow"
read_only = true
source = "manual(clum): read-only whitelist"

[[command]]
name = "cat"
effect = "allow"
read_only = true
source = "manual(clum): read-only whitelist"

[[command]]
name = "head"
effect = "allow"
read_only = true
source = "manual(clum): read-only whitelist"

[[command]]
name = "tail"
effect = "allow"
read_only = true
source = "manual(clum): read-only whitelist"

[[command]]
name = "stat"
effect = "allow"
read_only = true
source = "manual(clum): read-only whitelist"

[[command]]
name = "file"
effect = "allow"
read_only = true
source = "manual(clum): read-only whitelist"

