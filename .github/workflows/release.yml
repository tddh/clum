name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: macOS (arm64)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p clum-mcp -p clum-cli
      - name: Package
        run: |
          mkdir -p pkg/config pkg/.opencode/skills/clum-mcp
          cp target/release/clum-mcp target/release/clum-cli pkg/
          cp config/hosts.example.yaml config/mcp-config.example.json \
             config/server-config.yaml.example config/bridge.env.example \
             config/command-rules.toml config/command-kb.toml pkg/config/
          cp SKILL.md pkg/.opencode/skills/clum-mcp/
          cp README.md pkg/
          tar czf clum-macos-arm64.tar.gz -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: clum-macos-arm64.tar.gz

  build-linux:
    name: Linux (x86_64 musl)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --target x86_64-unknown-linux-musl --release -p clum-mcp -p clum-cli -p rmux-bridge
      - name: Package
        run: |
          mkdir -p pkg/config pkg/deploy pkg/.opencode/skills/clum-mcp
          cp target/x86_64-unknown-linux-musl/release/clum-mcp pkg/
          cp target/x86_64-unknown-linux-musl/release/clum-cli pkg/
          cp target/x86_64-unknown-linux-musl/release/rmux-bridge pkg/
          cp config/hosts.example.yaml config/mcp-config.example.json \
             config/server-config.yaml.example config/bridge.env.example \
             config/command-rules.toml config/command-kb.toml pkg/config/
          cp deploy/install-bridge.sh deploy/install-daemon.sh pkg/deploy/
          cp deploy/rmux-daemon.service pkg/deploy/
          cp deploy/generate-certs.sh pkg/deploy/
          cp SKILL.md pkg/.opencode/skills/clum-mcp/
          cp README.md pkg/
          tar czf clum-linux-x86_64.tar.gz -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: clum-linux-x86_64.tar.gz

  release:
    name: Create Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            clum-macos-arm64.tar.gz
            clum-linux-x86_64.tar.gz
          generate_release_notes: true
