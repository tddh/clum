[workspace]
members = [
    "crates/rmux-bridge",
    "crates/yunying-core",
    "crates/yunying-mcp",
    "crates/yunying-cli",
]
resolver = "2"

[workspace.package]
version = "0.9.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
yunying-core = { path = "crates/yunying-core" }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
regex = "1"
futures = "0.3"
quinn = "0.11"
clap = "4"
serde_yml = "0.0"
rmcp = { version = "=3.0.0", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
