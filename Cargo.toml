[workspace]
members = [
    "crates/rmux-bridge",
    "crates/clum-core",
    "crates/clum-mcp",
    "crates/clum-cli",
    "crates/clum-command-kb",
]
resolver = "2"

[workspace.package]
version = "0.19.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
clum-core = { path = "crates/clum-core" }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
regex = "1"
futures = "0.3"
quinn = "0.11"
fastrand = "2"
clap = "4"
serde_norway = "0.9"
# elicitation feature 已移除（2026-11-16）：审批运行时 2026-10 拆除，代码零引用。
# 人工审批是既定路线图（必然要做），重建时在此加回 "elicitation" 并评估客户端支持度；
# 设计记录见 clum-docs/authorization-design.md §6.1。
rmcp = { version = "=3.10.0", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
shell-words = "1.1"
parking_lot = "0.12"
